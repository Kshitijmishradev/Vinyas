name: vinyas

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose: ["8000"]
    volumes:
      - ${VINYAS_REPO:-${ARCHITECT_REPO:-.}}:/workspace:ro
      - vinyas-data:/data
    environment:
      VINYAS_ROOT: /workspace
      VINYAS_DATA_DIR: /data
      VINYAS_MAX_JOBS: "2"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  vinyas-data:
