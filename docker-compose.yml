services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose: ["8000"]
    volumes:
      - ${ARCHITECT_REPO:-.}:/workspace:ro
      - architect-data:/data
    environment:
      ARCHITECT_ROOT: /workspace
      ARCHITECT_DATA_DIR: /data
      ARCHITECT_MAX_JOBS: "2"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  architect-data:
