include: ["architect/**/*.py", "frontend/src/**/*"]
exclude: ["**/*.test.ts", "**/__pycache__/**"]
layers:
  - name: api
    match: ["architect/api_*.py"]
  - name: core
    match: ["architect/engine.py", "architect/analyzers.py", "architect/models.py"]
  - name: storage
    match: ["architect/storage.py"]
forbidden_dependencies:
  - from: core
    to: api
# When present, every cross-layer dependency not listed here is denied.
# allowed_dependencies:
#   - { from: api, to: core }
thresholds:
  cycles: 0
  fan_out: 20
  unresolved_imports: 0
  cross_boundary: 20
suppressions:
  - rule: unresolved-import
    path: "legacy/**"
    reason: "Legacy resolver migration tracked in issue #123"
    expires: 2026-12-31
