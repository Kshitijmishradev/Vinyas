name: Vinyas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -e '.[dev]'
      - run: ruff check architect tests
      - run: mypy architect
      - run: pytest --cov=architect --cov-report=term-missing
      - if: matrix.python-version == '3.12'
        run: vinyas check . --baseline ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --sarif vinyas.sarif --html vinyas-report.html
      - if: always() && matrix.python-version == '3.12'
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: vinyas.sarif }
      - if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with: { name: vinyas-report, path: vinyas-report.html }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
